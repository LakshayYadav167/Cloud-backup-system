name: CI - Continuous Integration (Strict ₹0 Cost)

# ==============================================================================
# Cloud Backup System - GitHub Actions CI Pipeline
# ==============================================================================
# Budget: Strict ₹0 Cost (Standard GitHub-hosted ubuntu-latest runner)
# Enforces automated quality gates:
#   1. Backend dependencies & complete Pytest suite (reporting passes/skips)
#   2. Frontend dependencies (npm ci), Vitest suite & Vite production build
#   3. Docker Compose configuration validation & local image build checks
#   4. Opt-in Floci S3 emulator live integration testing (via workflow_dispatch)
#
# Constraints & Safeguards:
#   - Least-privilege permissions: contents: read
#   - Timeout limits to prevent runaway runs: 10 minutes per job
#   - Automated run cancellation for outdated commits (concurrency)
#   - Zero external cloud services, zero paid marketplace actions, zero deployments
# ==============================================================================

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_docker:
        description: 'Build local Docker container images for validation'
        type: boolean
        default: true
      run_floci_integration:
        description: 'Run live Floci S3 emulator integration tests (starts local Floci container)'
        type: boolean
        default: false

# Prevent duplicate/stale concurrent workflow runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read-only access to repository contents
permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Backend Verification (Python / Pytest)
  # ----------------------------------------------------------------------------
  backend:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      APP_ENV: ci
      CI: 'true'
      STORAGE_PROVIDER: local

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend pytest suite
        run: |
          python -m pytest backend/tests/ -v -ra

  # ----------------------------------------------------------------------------
  # Job 2: Frontend Verification (Vitest / TypeScript / Vite)
  # ----------------------------------------------------------------------------
  frontend:
    name: Frontend Vitest & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    env:
      CI: 'true'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies (strict reproducible npm ci)
        run: npm ci

      - name: Run frontend unit & component tests (Vitest)
        run: npm test

      - name: Compile TypeScript & build Vite production bundle
        run: npm run build

      - name: Verify production bundle integrity
        run: test -f dist/index.html

  # ----------------------------------------------------------------------------
  # Job 3: Docker & Compose Validation (Local / Zero Cost)
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Docker Compose & Image Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify Docker daemon and Compose availability
        run: |
          docker --version
          docker compose version

      - name: Validate Docker Compose configurations (dry-run)
        run: |
          docker compose config --quiet
          docker compose --profile s3 config --quiet
          echo "Docker Compose configurations (default and S3 profile) validated successfully."

      - name: Build local container images (verification only - no deployment)
        if: github.event_name != 'workflow_dispatch' || inputs.build_docker == true
        run: |
          docker build -t cloud-backup-backend:ci -f docker/Dockerfile.backend backend
          docker build -t cloud-backup-frontend:ci -f docker/Dockerfile.frontend frontend
          echo "Local Docker images built cleanly. Verification only; no registry upload or deployment performed."

  # ----------------------------------------------------------------------------
  # Job 4: Optional Floci S3 Live Integration (Opt-in Manual Dispatch Only)
  # ----------------------------------------------------------------------------
  floci-integration:
    name: Floci S3 Live Integration (Opt-in Manual Dispatch)
    if: github.event_name == 'workflow_dispatch' && inputs.run_floci_integration == true
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Start local Floci S3 emulator container
        run: |
          docker compose --profile s3 up -d floci
          echo "Waiting for Floci emulator to be healthy..."
          timeout 30s bash -c 'until curl -sf http://127.0.0.1:4566/_floci/health; do sleep 1; done' || exit 1
          echo "Floci emulator is ready on port 4566."

      - name: Run live S3 integration tests
        env:
          APP_ENV: ci
          STORAGE_PROVIDER: s3
          S3_ENDPOINT_URL: http://127.0.0.1:4566
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test
          S3_BUCKET_NAME: cloud-backup-system
        run: |
          python -m pytest backend/tests/test_floci_integration.py backend/tests/test_storage_s3.py -v -k "floci"

      - name: Safely stop Floci container (preserve persistent data volumes)
        if: always()
        run: docker compose stop floci
